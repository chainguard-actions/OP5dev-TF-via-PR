name: Test tool check - missing tool fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Add fixture bin to PATH (provides mock gh, jq, etc.)
        run: echo "$GITHUB_WORKSPACE/tests/fixtures/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          tool: nonexistent-tf-tool-xyz-12345
          command: ""
          upload-plan: "false"
          comment-pr: "never"
          pr-number: "0"

      - name: Assert action fails when tool is not installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when tool is not installed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when tool is not installed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
