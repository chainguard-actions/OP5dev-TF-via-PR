name: Test format check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh CLI and fake terraform
        run: |
          mkdir -p "$HOME/.local/bin"
          cp tests/fixtures/fake-gh.sh "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"
          cat > "$HOME/.local/bin/terraform" << 'EOF'
          #!/bin/sh
          # Fake terraform: handle fmt and other commands
          # Find the command (skip -chdir=... prefix args)
          cmd=""
          for arg in "$@"; do
            case "$arg" in
              -chdir=*) ;;
              fmt|init|plan|validate|show) cmd="$arg"; break ;;
            esac
          done
          case "$cmd" in
            fmt)
              # Simulate successful format check (no output = all files formatted)
              exit 0
              ;;
            *)
              echo "Terraform v1.0.0"
              exit 0
              ;;
          esac
          EOF
          chmod +x "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          command: ""
          tool: terraform
          format: "true"
          arg-recursive: "true"
          pr-number: "0"

      - name: Assert format step succeeded
        env:
          EXITCODE: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "exitcode: '$EXITCODE'"
          if [ "$EXITCODE" != "0" ]; then
            echo "FAIL: expected exitcode 0 for successful format check, got '$EXITCODE'"
            exit 1
          fi
          echo "PASS: format check succeeded with exitcode 0"
