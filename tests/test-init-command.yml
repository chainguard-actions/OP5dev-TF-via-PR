name: Test init command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock terraform and ensure required tools are available
        run: |
          # Create a mock terraform binary that handles init, validate, etc.
          # The mock outputs something reasonable for each command
          printf '#!/bin/sh\necho "Terraform has been successfully initialized!"\nexit 0\n' > /usr/local/bin/terraform
          chmod +x /usr/local/bin/terraform

          # Verify required tools (install gh if not present)
          which gh > /dev/null 2>&1 || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y gh
          }
          which jq || { echo "jq not found"; exit 1; }
          which md5sum || { echo "md5sum not found"; exit 1; }
          which unzip || { echo "unzip not found"; exit 1; }
          which terraform
          echo "All tools available"

      - id: action
        uses: .
        with:
          command: init
          tool: terraform
          pr-number: "0"
          arg-chdir: tests/fixtures/tf-init
          arg-backend: "false"
        continue-on-error: true

      - name: Assert action ran (init succeeded; post may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IDENTIFIER: ${{ steps.action.outputs.identifier }}
          EXITCODE: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "identifier: $IDENTIFIER"
          echo "exitcode: $EXITCODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$IDENTIFIER" ]; then
              echo "FAIL: action succeeded but identifier output is empty"
              exit 1
            fi
            echo "PASS: init succeeded, identifier='$IDENTIFIER'"
          elif [ "$OUTCOME" = "failure" ]; then
            # The post step makes API calls that fail with the sentinel repo.
            # As long as the identifier was set, the init step ran successfully.
            if [ -z "$IDENTIFIER" ]; then
              echo "FAIL: action failed before identifier step ran"
              exit 1
            fi
            echo "PASS: action failed gracefully (likely post step on sentinel repo), identifier='$IDENTIFIER'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert identifier matches expected pattern
        env:
          ACTUAL: ${{ steps.action.outputs.identifier }}
        run: |
          echo "actual identifier: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: identifier is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -qE '^terraform-[0-9]+-[a-f0-9]{32}\.tfplan$'; then
            echo "PASS: identifier matches pattern terraform-<pr>-<md5>.tfplan"
          else
            echo "FAIL: identifier '$ACTUAL' does not match expected pattern"
            exit 1
          fi
