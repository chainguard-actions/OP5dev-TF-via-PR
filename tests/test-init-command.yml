name: Test init command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh CLI and fake terraform
        run: |
          mkdir -p "$HOME/.local/bin"
          cp tests/fixtures/fake-gh.sh "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"
          cat > "$HOME/.local/bin/terraform" << 'EOF'
          #!/bin/sh
          # Fake terraform: handle all commands, supporting -chdir=<dir> prefix
          cmd=""
          for arg in "$@"; do
            case "$arg" in
              -chdir=*) ;;
              init|plan|validate|show|fmt|apply) cmd="$arg"; break ;;
            esac
          done
          case "$cmd" in
            init)
              echo "Initializing the backend..."
              echo "Terraform has been successfully initialized!"
              exit 0
              ;;
            validate)
              echo "Success! The configuration is valid."
              exit 0
              ;;
            show)
              echo "No changes. Your infrastructure matches the configuration."
              exit 0
              ;;
            *)
              echo "Terraform v1.0.0"
              exit 0
              ;;
          esac
          EOF
          chmod +x "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          command: "init"
          tool: terraform
          arg-chdir: "tests/fixtures/tf-init"
          pr-number: "0"
          comment-pr: "never"
        continue-on-error: true

      - name: Assert identifier output is set
        env:
          IDENTIFIER: ${{ steps.action.outputs.identifier }}
        run: |
          echo "identifier: '$IDENTIFIER'"
          if [ -z "$IDENTIFIER" ]; then
            echo "FAIL: identifier output should not be empty"
            exit 1
          fi
          if ! echo "$IDENTIFIER" | grep -q '\.tfplan$'; then
            echo "FAIL: identifier '$IDENTIFIER' should end with .tfplan"
            exit 1
          fi
          echo "PASS: identifier is set correctly"

      - name: Assert exitcode is 0 for successful init
        env:
          EXITCODE: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "exitcode: '$EXITCODE'"
          # exitcode may be empty if post step failed before setting it
          # but if set, it should be 0 for a successful init
          if [ -n "$EXITCODE" ] && [ "$EXITCODE" != "0" ]; then
            echo "FAIL: expected exitcode 0 for successful init, got '$EXITCODE'"
            exit 1
          fi
          echo "PASS: exitcode '$EXITCODE' is valid for init command"
