name: Test init command with minimal TF config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install prerequisites and terraform
        run: |
          # Install missing tools if needed
          NEED_APT_UPDATE=false
          if ! which gh > /dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            NEED_APT_UPDATE=true
          fi
          PKGS=""
          which jq > /dev/null 2>&1 || PKGS="$PKGS jq"
          which unzip > /dev/null 2>&1 || PKGS="$PKGS unzip"
          which gh > /dev/null 2>&1 || PKGS="$PKGS gh"
          if [ -n "$PKGS" ] || [ "$NEED_APT_UPDATE" = "true" ]; then
            sudo apt-get update -qq
            for pkg in $PKGS; do sudo apt-get install -y -qq "$pkg"; done
          fi
          # Install terraform via direct binary download if not present
          if ! which terraform > /dev/null 2>&1; then
            TF_VERSION="1.9.8"
            curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
            sudo unzip -q /tmp/terraform.zip -d /usr/local/bin/
            sudo chmod +x /usr/local/bin/terraform
            rm /tmp/terraform.zip
          fi
          terraform version

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: init
          tool: terraform
          arg-chdir: tests/fixtures/tf-init
          pr-number: "0"
          upload-plan: "false"
          comment-pr: "never"
          validate: "false"

      - name: Assert identifier output is set
        env:
          ACTUAL: ${{ steps.action.outputs.identifier }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "identifier: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: identifier output is empty (action may have failed before identifier step)"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "terraform"; then
            echo "FAIL: identifier does not contain 'terraform'"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "\.tfplan$"; then
            echo "FAIL: identifier does not end with '.tfplan'"
            exit 1
          fi
          echo "PASS: identifier='$ACTUAL'"

      - name: Assert action ran (init succeeded or post step failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXITCODE: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exitcode: '$EXITCODE'"
          # The init command itself should succeed (exitcode=0).
          # The post step makes API calls to the sentinel repo which will fail,
          # causing the overall action outcome to be 'failure'.
          # We accept both success (if API calls somehow work) and failure (sentinel repo).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with exitcode=$EXITCODE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely post step failed on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
