name: Test missing tool prerequisite check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install prerequisites (but NOT the TF tool)
        run: |
          # Install missing tools if needed (but NOT terraform/tofu - we want that check to fail)
          NEED_APT_UPDATE=false
          if ! which gh > /dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            NEED_APT_UPDATE=true
          fi
          PKGS=""
          which jq > /dev/null 2>&1 || PKGS="$PKGS jq"
          which unzip > /dev/null 2>&1 || PKGS="$PKGS unzip"
          which gh > /dev/null 2>&1 || PKGS="$PKGS gh"
          if [ -n "$PKGS" ] || [ "$NEED_APT_UPDATE" = "true" ]; then
            sudo apt-get update -qq
            for pkg in $PKGS; do sudo apt-get install -y -qq "$pkg"; done
          fi
          # Confirm the fake tool is NOT available
          if which nonexistent-tf-tool-xyz > /dev/null 2>&1; then
            echo "ERROR: nonexistent-tf-tool-xyz should not be installed"
            exit 1
          fi
          echo "Confirmed: nonexistent-tf-tool-xyz is not available"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: ""
          tool: nonexistent-tf-tool-xyz
          pr-number: "0"
          upload-plan: "false"
          comment-pr: "never"

      - name: Assert action failed due to missing tool
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tool is missing, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required tool was not found"
