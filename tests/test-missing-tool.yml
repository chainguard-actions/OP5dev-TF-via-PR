name: Test missing tool detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: "plan"
          # Use a non-existent tool name to trigger the "which" check failure
          tool: "nonexistent-tf-tool-xyz-abc"
          upload-plan: "false"
          pr-number: "0"

      - name: Assert action failed due to missing tool
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tool is not installed, but got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required tool is not installed"
