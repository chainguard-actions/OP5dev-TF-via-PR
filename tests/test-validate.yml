name: Test validate command
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Add fixture bin to PATH (provides mock gh and terraform)
        run: echo "$GITHUB_WORKSPACE/tests/fixtures/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          tool: terraform
          command: init
          validate: "true"
          arg-chdir: "tests/fixtures/tf-basic"
          arg-backend: "false"
          upload-plan: "false"
          comment-pr: "never"
          pr-number: "0"

      - name: Assert exit code is 0 (valid config)
        env:
          EXITCODE: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "exitcode: '$EXITCODE'"
          if [ "$EXITCODE" != "0" ]; then
            echo "FAIL: expected exit code 0 for valid TF config, got '$EXITCODE'"
            exit 1
          fi
          echo "PASS: validate succeeded with exit code 0"

      - name: Assert result contains success indicator
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: '$RESULT'"
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          # Result should contain "Success" or "initialized" for a valid config
          if echo "$RESULT" | grep -qi "success\|valid\|initialized"; then
            echo "PASS: result contains success indicator"
          else
            echo "INFO: result does not explicitly mention success, but exit code was 0"
            echo "PASS: validation completed successfully"
          fi
