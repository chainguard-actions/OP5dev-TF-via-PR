name: Test init command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stub tools
        run: |
          mkdir -p "$HOME/.local/bin"

          # Stub gh: returns empty JSON array for API calls
          cat > "$HOME/.local/bin/gh" << 'GHEOF'
          #!/bin/sh
          if [ "$1" = "api" ]; then
            echo "[]"
            exit 0
          fi
          echo "gh version 2.0.0 (stub)"
          exit 0
          GHEOF
          chmod +x "$HOME/.local/bin/gh"

          # Stub terraform: handles -chdir, init, validate, plan, show
          cat > "$HOME/.local/bin/terraform" << 'TFEOF'
          #!/bin/sh
          # Parse arguments to find -chdir and subcommand
          chdir=""
          subcmd=""
          out_file=""
          for arg in "$@"; do
            case "$arg" in
              -chdir=*) chdir="${arg#-chdir=}" ;;
              init|validate|plan|show|fmt|version) subcmd="$arg" ;;
              -out=*) out_file="${arg#-out=}" ;;
            esac
          done

          case "$subcmd" in
            init)
              # Create .terraform directory to simulate successful init
              target="${chdir:-.}"
              mkdir -p "$target/.terraform"
              echo "Terraform has been successfully initialized!"
              exit 0
              ;;
            validate)
              echo "Success! The configuration is valid."
              exit 0
              ;;
            plan)
              # Create the plan file
              target="${chdir:-.}"
              if [ -n "$out_file" ]; then
                echo "plan-stub" > "$target/$out_file"
              fi
              echo "No changes. Your infrastructure matches the configuration."
              exit 0
              ;;
            show)
              echo "No changes. Your infrastructure matches the configuration."
              exit 0
              ;;
            fmt)
              exit 0
              ;;
            version)
              echo "Terraform stub v1.0.0"
              exit 0
              ;;
            *)
              echo "Terraform stub v1.0.0"
              exit 0
              ;;
          esac
          TFEOF
          chmod +x "$HOME/.local/bin/terraform"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: "init"
          tool: terraform
          arg-chdir: "tests/fixtures/tf-init"
          arg-backend: "false"
          upload-plan: "false"
          pr-number: "0"

      - name: Assert action ran (success or graceful failure at post step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail at the post step (sentinel repo API call)
          # but init should have run before that
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert terraform init ran (check .terraform directory)
        run: |
          # terraform init creates a .terraform directory in the working directory
          # arg-chdir=tests/fixtures/tf-init means .terraform is created there
          if [ -d "tests/fixtures/tf-init/.terraform" ]; then
            echo "PASS: .terraform directory exists, init ran successfully"
          else
            echo "FAIL: .terraform directory not found at tests/fixtures/tf-init/.terraform"
            echo "Contents of tests/fixtures/tf-init:"
            ls -la tests/fixtures/tf-init/ || true
            exit 1
          fi
