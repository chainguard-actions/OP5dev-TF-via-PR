name: Test tofu tool option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "12345"
      GITHUB_RUN_ATTEMPT: "1"
      GITHUB_JOB: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake tofu binary
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/tofu" << 'EOF'
          #!/bin/bash
          subcmd="$1"
          shift
          case "$subcmd" in
            init)
              echo "OpenTofu has been successfully initialized!"
              exit 0
              ;;
            plan)
              echo "No changes. Your infrastructure matches the configuration."
              for arg in "$@"; do
                if [[ "$arg" == "-out=tfplan" ]]; then
                  touch tfplan
                fi
              done
              exit 0
              ;;
            show)
              echo "No changes. Your infrastructure matches the configuration."
              exit 0
              ;;
            *)
              echo "fake tofu $subcmd $@"
              exit 0
              ;;
          esac
          EOF
          chmod +x "$HOME/bin/tofu"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install fake gh binary
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/gh" << 'EOF'
          #!/bin/bash
          args="$*"
          if echo "$args" | grep -q "actions/runs"; then
            echo '{"jobs":[{"id":12345,"name":"test","status":"in_progress","steps":[{"number":1,"name":"Set up job","status":"completed"},{"number":2,"name":"Post output","status":"in_progress"}]}]}'
          elif echo "$args" | grep -q "check-runs"; then
            echo '{"id":99999,"html_url":"https://github.com/test-owner/test-repo/runs/99999"}'
          elif echo "$args" | grep -q "commits"; then
            echo '[]'
          elif echo "$args" | grep -q "pulls"; then
            echo '[]'
          elif echo "$args" | grep -q "issues"; then
            echo '[]'
          elif echo "$args" | grep -q "artifacts"; then
            echo '{"artifacts":[]}'
          else
            echo '{}'
          fi
          exit 0
          EOF
          chmod +x "$HOME/bin/gh"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          tool: tofu
          command: plan
          upload-plan: "false"
          comment-pr: "never"
          pr-number: "0"
        continue-on-error: true

      - name: Assert action did not error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" == "failure" ]; then
            echo "FAIL: action unexpectedly failed"
            exit 1
          fi
          echo "PASS: action completed"

      - name: Assert exitcode is 0
        env:
          EXITCODE: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "exitcode: '$EXITCODE'"
          if [ "$EXITCODE" != "0" ]; then
            echo "FAIL: expected exitcode '0', got '$EXITCODE'"
            exit 1
          fi
          echo "PASS: tofu plan command succeeded"

      - name: Assert identifier uses tofu prefix
        env:
          ACTUAL: ${{ steps.action.outputs.identifier }}
        run: |
          echo "actual identifier: '$ACTUAL'"
          if [[ ! "$ACTUAL" =~ ^tofu-0-[a-f0-9]{32}\.tfplan$ ]]; then
            echo "FAIL: identifier '$ACTUAL' does not match expected pattern 'tofu-0-<md5hash>.tfplan'"
            exit 1
          fi
          echo "PASS: identifier uses tofu prefix correctly"
