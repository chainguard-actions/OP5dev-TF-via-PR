name: Test format command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake terraform binary
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/terraform" << 'EOF'
          #!/bin/bash
          echo "fake terraform $@"
          exit 0
          EOF
          chmod +x "$HOME/bin/terraform"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install fake gh binary
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/gh" << 'EOF'
          #!/bin/bash
          echo '[]'
          exit 0
          EOF
          chmod +x "$HOME/bin/gh"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          tool: terraform
          command: ""
          format: "true"
          arg-check: "true"
          arg-diff: "true"
          arg-recursive: "true"
          upload-plan: "false"
          comment-pr: "never"
          pr-number: "0"
        continue-on-error: true

      - name: Assert action did not error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" == "failure" ]; then
            echo "FAIL: action unexpectedly failed"
            exit 1
          fi
          echo "PASS: action completed"

      - name: Assert format step ran (exitcode output set)
        env:
          EXITCODE: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "exitcode: '$EXITCODE'"
          # The fake terraform exits 0, so exitcode should be 0
          if [ "$EXITCODE" != "0" ]; then
            echo "FAIL: expected exitcode '0', got '$EXITCODE'"
            exit 1
          fi
          echo "PASS: format step ran successfully"

      - name: Assert identifier output is set
        env:
          ACTUAL: ${{ steps.action.outputs.identifier }}
        run: |
          echo "actual identifier: '$ACTUAL'"
          if [[ ! "$ACTUAL" =~ ^terraform-0-[a-f0-9]{32}\.tfplan$ ]]; then
            echo "FAIL: identifier '$ACTUAL' does not match expected pattern"
            exit 1
          fi
          echo "PASS: identifier is set correctly"
