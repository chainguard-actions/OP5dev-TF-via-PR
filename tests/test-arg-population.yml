name: Test arg population
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stub tools
        run: |
          mkdir -p "$HOME/.local/bin"

          # Stub gh: minimal implementation that handles the API calls needed
          cat > "$HOME/.local/bin/gh" << 'EOF'
          #!/bin/sh
          # Stub gh CLI for testing
          # For 'gh api' calls, return empty JSON array
          if [ "$1" = "api" ]; then
            echo "[]"
            exit 0
          fi
          # For 'gh --version'
          if [ "$1" = "--version" ]; then
            echo "gh version 2.0.0 (stub)"
            exit 0
          fi
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/gh"

          # Stub terraform: just exits 0
          cat > "$HOME/.local/bin/terraform" << 'EOF'
          #!/bin/sh
          echo "Terraform stub v1.0.0"
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/terraform"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          # command="" means no init/plan/apply/post step runs
          # pr-number bypasses the gh api call in the identifier step
          command: ""
          tool: terraform
          arg-chdir: "stacks/dev"
          arg-var: "env=dev"
          arg-var-file: "dev.tfvars"
          arg-target: "module.vpc,module.eks"
          arg-destroy: "true"
          arg-parallelism: "10"
          arg-lock: "false"
          arg-lock-timeout: "30s"
          arg-compact-warnings: "true"
          arg-refresh: "true"
          pr-number: "42"
          upload-plan: "false"

      - name: Assert identifier output is set
        env:
          IDENTIFIER: ${{ steps.action.outputs.identifier }}
        run: |
          echo "identifier: $IDENTIFIER"
          if [ -z "$IDENTIFIER" ]; then
            echo "FAIL: identifier output is empty"
            exit 1
          fi
          # Should contain 'terraform' and end with '.tfplan'
          if ! echo "$IDENTIFIER" | grep -q "terraform"; then
            echo "FAIL: identifier does not contain 'terraform'"
            exit 1
          fi
          if ! echo "$IDENTIFIER" | grep -q "\.tfplan$"; then
            echo "FAIL: identifier does not end with '.tfplan'"
            exit 1
          fi
          echo "PASS: identifier='$IDENTIFIER'"

      - name: Assert identifier contains PR number
        env:
          IDENTIFIER: ${{ steps.action.outputs.identifier }}
        run: |
          echo "identifier: $IDENTIFIER"
          if ! echo "$IDENTIFIER" | grep -q "\-42\-"; then
            echo "FAIL: identifier does not contain PR number '42'"
            exit 1
          fi
          echo "PASS: identifier contains PR number 42"
